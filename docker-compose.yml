services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goodevadesk
      POSTGRES_PASSWORD: goodevadesk
      POSTGRES_DB: goodevadesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodevadesk -d goodevadesk"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [private]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [private]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://goodevadesk:goodevadesk@postgres:5432/goodevadesk?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CORS_ORIGIN: https://goodevadesk.fatihur.web.id
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      BODY_LIMIT: ${BODY_LIMIT:-100kb}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      PYTHON_NLP_ENABLED: ${PYTHON_NLP_ENABLED:-true}
      PYTHON_BIN: ${PYTHON_BIN:-python3}
      PYTHON_NLP_TIMEOUT_MS: ${PYTHON_NLP_TIMEOUT_MS:-2000}
      AI_PROVIDER: ${AI_PROVIDER:-custom}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      CACHE_VERSION: ${CACHE_VERSION:-v1}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-2592000}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-10000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:3005:3000"
    networks: [private]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on: [api]
    ports:
      - "127.0.0.1:8085:80"
    networks: [private]

volumes:
  postgres_data:
  redis_data:

networks:
  private:
    driver: bridge
